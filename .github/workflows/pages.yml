name: pages

on:
  push:
    branches: [main]
    paths: [web/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.version.outputs.bumped }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: version
        name: Deploy only when web/VERSION goes up
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          new="$(tr -d '[:space:]' < web/VERSION)"
          if ! printf '%s' "$new" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::web/VERSION must be MAJOR.MINOR.PATCH, got '$new'"
            exit 1
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "manual run: redeploying $new"
            exit 0
          fi
          old="$(git show "$BEFORE:web/VERSION" 2>/dev/null | tr -d '[:space:]' || true)"
          old="${old:-0.0.0}"
          top="$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n 1)"
          if [ "$new" != "$old" ] && [ "$top" = "$new" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "web/VERSION $old -> $new: deploying"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "::notice::web/VERSION is $new (was $old): not bumped, skipping deploy"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Stamp asset URLs and pin scripts and styles to this site's path
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          base="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/"
          sed -i "s/?v=dev/?v=${VERSION}/g" web/index.html
          sed -i "s|script-src 'self'|script-src ${base}|; s|style-src 'self'|style-src ${base}|" web/index.html
          grep -q "script-src ${base}" web/index.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
