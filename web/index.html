<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://api.github.com; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>gh-runner</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main id="app">
  <div class="cols">
    <div class="left">
      <section class="panel" id="statusPanel"><h2>Status</h2><div class="body" id="status"></div></section>
      <section class="panel" id="reposPanel"><h2>Repos <span class="foot" id="reposFoot"></span></h2><div class="body" id="repos"></div></section>
      <section class="panel list" id="runPanel"><h2 id="runTitle">[1] Running (0)</h2><div class="body scroll"><table id="runTable"></table></div><span class="foot" id="runFoot"></span></section>
      <section class="panel list" id="qPanel"><h2 id="qTitle">[2] Queued (0)</h2><div class="body scroll"><table id="qTable"></table></div><span class="foot" id="qFoot"></span></section>
    </div>
    <section class="panel right" id="detailPanel"><h2>Job</h2><div class="body" id="detail"></div></section>
  </div>
  <div class="keybar"><span id="hints"></span><input id="filter" placeholder="/ filter" spellcheck="false"><span id="info"></span></div>
  <form id="login" class="connect" autocomplete="off">
    <h2>Connect</h2>
    <label>Organisation <input id="org" name="org" required spellcheck="false"></label>
    <label>Repo <input id="repo" name="repo" spellcheck="false" placeholder="optional: owner/repo or name"></label>
    <label>Token <input id="token" name="token" type="password" required spellcheck="false" autocomplete="off"></label>
    <div class="pair">
      <label>Days <input id="days" name="days" type="number" min="0" value="7"></label>
      <label>Refresh (s) <input id="interval" name="interval" type="number" min="5" value="15"></label>
    </div>
    <p class="dim">Fine-grained token, <b>Actions: read</b>. Kept in this tab's memory only and sent only to api.github.com. Leave Repo empty to scan the whole organisation.</p>
    <p id="loginError" class="red"></p>
    <button type="submit">enter: start</button>
  </form>
</main>
</body>
</html>
